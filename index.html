<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>TrilhaNav</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0d1620;--card:#15222f;--txt:#e8eef3;--mut:#9fb0bf;--acc:#2fa8ff}
@media (prefers-color-scheme: light){:root{--bg:#f3f6f9;--card:#fff;--txt:#14202b;--mut:#4f6272;--acc:#0b6fb8}}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px}
h1{display:flex;align-items:center;gap:12px;font-size:28px;margin:0 0 8px}
h1 img{width:44px;height:44px}
p{color:var(--mut);margin:8px 0}
.card{background:var(--card);border-radius:14px;padding:18px;margin:20px 0}
a.btn{display:block;text-align:center;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:10px;font-size:18px}
small{display:block;color:var(--mut);margin-top:10px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <h1><img src="icon.svg" alt="">TrilhaNav</h1>
  <p>Navegação de moto para Android: mapa offline de Minas Gerais, rota com e sem internet, voz no capacete, telefone e música.</p>
  <div class="card">
    <a class="btn" id="dl" href="https://github.com/Lubiell/trilhanav/tree/apk">Baixar o app (APK)</a>
    <small id="info">A versão no navegador foi retirada: o TrilhaNav agora é só o app para Android.</small>
  </div>
  <p>Depois de instalado, o app procura atualização sozinho.</p>
</main>
<script>
/* link direto para o APK mais novo (o mesmo versao.json que o app lê para se atualizar) */
fetch('https://raw.githubusercontent.com/Lubiell/trilhanav/apk/versao.json',{cache:'no-store'}).then(r=>r.json()).then(v=>{
  if(!v||!/^https:\/\/raw\.githubusercontent\.com\/Lubiell\/trilhanav\/apk\/[\w.-]+\.apk$/.test(v.apk))return;
  const a=document.getElementById('dl');a.href=v.apk;a.textContent='Baixar o app (APK '+String(v.version).replace(/[^\d.]/g,'')+')';
  document.getElementById('info').textContent='SHA-256: '+String(v.sha256).replace(/[^0-9a-f]/g,'')}).catch(()=>{});
/* o site antigo era um app (PWA) com service worker: tira o que ficou guardado no navegador */
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if(window.caches)caches.keys().then(ks=>ks.filter(k=>/^trilhanav-/.test(k)).forEach(k=>caches.delete(k))).catch(()=>{});
</script>
</body>
</html>
