name: Emulador
# Teste do APK publicado num Android de verdade (emulador oficial com KVM): atualização por cima da versão anterior,
# abertura sem travar, serviço de voz, foco de áudio (música), migração do microfone do capacete, download automático
# do mapa no Wi-Fi e o "Sair do app". Prints, logcat e relatório no artefato "emulador".
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      compilar:
        description: 'compilar e testar também o APK do código deste branch'
        default: 'sim'
      novo:
        description: 'versão a testar (do branch apk)'
        default: '2.7.8'
      anterior:
        description: 'versão instalada antes (atualiza por cima)'
        default: '2.7.7'
  push:
    branches: [claude/loving-lovelace-yzb96l]
    paths: ['.github/workflows/emulador.yml', 'dev/emu/**', 'index.html', 'android-app/**']
jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Compilar o APK do branch (como o apk.yml; chave de depuração)
        if: github.event_name == 'push' || github.event.inputs.compilar == 'sim'
        working-directory: android-app
        run: |
          python3 -m pip install --user --quiet pillow==12.3.0
          npm ci --ignore-scripts --no-audit --no-fund
          bash build-apk.sh
          mkdir -p ../dev/emu/apk && cp trilhanav-*.apk ../dev/emu/apk/trilhanav-branch.apk
      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Emulador e testes
        env:
          NOVO: ${{ github.event.inputs.novo || '2.7.8' }}
          ANTERIOR: ${{ github.event.inputs.anterior || '2.7.7' }}
        run: bash dev/emu/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: emulador
          path: dev/emu/out
