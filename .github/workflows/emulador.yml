name: Emulador
# Teste do APK publicado num Android de verdade (emulador oficial com KVM): atualização por cima da versão anterior,
# abertura sem travar, serviço de voz, foco de áudio (música), migração do microfone do capacete, download automático
# do mapa no Wi-Fi e o "Sair do app". Prints, logcat e relatório no artefato "emulador".
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      novo:
        description: 'versão a testar (do branch apk)'
        default: '2.7.8'
      anterior:
        description: 'versão instalada antes (atualiza por cima)'
        default: '2.7.7'
  push:
    branches: [claude/loving-lovelace-yzb96l]
    paths: ['.github/workflows/emulador.yml', 'dev/emu/**']
jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Emulador e testes
        env:
          NOVO: ${{ github.event.inputs.novo || '2.7.8' }}
          ANTERIOR: ${{ github.event.inputs.anterior || '2.7.7' }}
        run: bash dev/emu/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: emulador
          path: dev/emu/out
